<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Gestalya</title>
    <!--
      GitHub Pages sert ce fichier pour toute URL qui ne correspond à
      aucun fichier statique (ex: /contact, /nos-services). Comme le site
      est une SPA (React Router), on encode le chemin demandé dans la
      query string puis on redirige vers index.html, qui restaure ensuite
      la vraie URL via history.replaceState avant que React ne s'affiche.
      Technique standard "spa-github-pages" (rafgraph), ne modifie aucun
      contenu ni comportement visible du site.
    -->
    <script>
      var pathSegmentsToKeep = 0; // 0 : domaine personnalisé à la racine (gestalya.fr)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
